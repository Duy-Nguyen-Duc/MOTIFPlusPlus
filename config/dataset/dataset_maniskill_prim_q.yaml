# dataset_maniskill_prim plus the window's joint positions (demo_data_processed_prim_q, built by
# data/process/append_qpos.py from the raw ManiSkill h5): batch["qpos"] [T, 12] for the temporal kinematic graph
# ablation (models.stage1.graph_temporal=true). Same split, same frame cache (keyed by the robot directory name).
# data_config_suffix: "_q" for stages 1-2 (qpos in the batch), "_geo" for stage 3 (geometry tokens; the policy
# never reads qpos, the stage-3 router runs the graph without trajectories).
data_config_suffix: "_q"
dataset_path:
  - ./demo_data_processed_prim_q/panda
  - ./demo_data_processed_prim_q/xarm6
  - ./demo_data_processed_prim_q/widowxai
embodiment_tag:
  - panda_rel
  - xarm6_rel
  - widowxai_rel
data_config:
  - panda_rel_prim${dataset.data_config_suffix}
  - xarm6_rel_prim${dataset.data_config_suffix}
  - widowxai_rel_prim${dataset.data_config_suffix}
video_backend:
  - decord
  - decord
  - decord

# K-shot target pairs; unlisted tasks keep all 50 demos (leading slice [:K], demos selected sequentially).
modifiy_tasks_num:
  - "Push the cube across the surface to the target location.": ${K}
    "Pick up the sphere and place it precisely into the target.": ${K}
  - "Pull the cube toward the target marker.": ${K}
    "Lift the peg and stand it upright.": ${K}
  - "Pick up the cube.": ${K}
    "Stack the cube on top of the other cube.": ${K}

drop_video: false                               # stage 1 sets true (no images needed)
frame_cache_root: ./demo_data/frame_cache_full  # pre-decoded frames (data/process/prextract_frames.py --format webp)

window_size: ${window_size}
sampling_weights: null
batch_size: ${batch_size}
num_workers: 16
prefetch_factor: 1
pin_memory: false
drop_last: true
persistent_workers: false
shuffle: true
balance_tasks: ${balance_tasks}
collator:
  normalize_images: true
