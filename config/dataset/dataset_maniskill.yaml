# ManiSkill interleaved-task dataset (paper Table 2).
#
# 50 demonstrations are collected for every embodiment-task pair. Each robot then has
# 2 "Few" (K-shot target) tasks and 4 "Full" (50-demo source) tasks, so that every task
# is a full-data source on one robot and a few-shot target on another.
#
#            PushCube  PlaceSphere  PullCube  LiftPegUpright  PickCube  StackCube
#   Panda      Few         Few        Full         Full         Full      Full
#   xArm6      Full        Full       Few          Few          Full      Full
#   WidowXAI   Full        Full       Full         Full         Few       Few
#
# `modifiy_tasks_num` only truncates the tasks it lists (data/dataset.py:_get_tasks_map_to_id),
# so the Full tasks are left out of each dict and keep all 50 episodes. Truncation is a
# leading slice [:K], which matches the paper's "demonstrations are selected sequentially".
#
# K is set by the `K` interpolation below; change it in the train_stage*.yaml or on the
# command line (e.g. `K=5`) to sweep K in {1,3,5,10,50}.

dataset_path:
  - ./demo_data_processed/panda
  - ./demo_data_processed/xarm6
  - ./demo_data_processed/widowxai
embodiment_tag:
  - panda_rel
  - xarm6_rel
  - widowxai_rel
data_config:
  - panda_rel
  - xarm6_rel
  - widowxai_rel
# decord, not torchcodec: torchcodec imports fine on its own but raises inside the full
# data.dataset import chain in this env (ffmpeg version clash with PyAV/decord), so
# utils/video.py sets TORCHCODEC_AVAILABLE=False and get_frames_by_timestamps raises.
# decord is LeRobotSingleDataset's own default backend and decodes these mp4s correctly.
video_backend:
  - decord
  - decord
  - decord

# Few-shot target pairs only; unlisted tasks keep all 50 demos.
modifiy_tasks_num:
  - "Push the cube across the surface to the target location.": ${K}
    "Pick up the sphere and place it precisely into the target.": ${K}
  - "Pull the cube toward the target marker.": ${K}
    "Lift the peg and stand it upright.": ${K}
  - "Pick up the cube.": ${K}
    "Stack the cube on top of the other cube.": ${K}

# Skip the video modality and its transforms entirely. Stage 1 sets this true
# (it reads only rel_state/progress/language/embodiment_id and never touches
# batch["images"]); stages 2 and 3 must leave it false because DINOv2 and T5
# consume the images. Verified to leave every other tensor bit-identical.
drop_video: false

# Directory of pre-decoded frame memmaps (data/process/prextract_frames.py). When
# set, stages 2 and 3 read pixels from it instead of re-decoding mp4s every epoch.
# null falls back to per-sample decoding. Ignored when drop_video is true.
frame_cache_root: ./demo_data/frame_cache

window_size: ${window_size}
sampling_weights: null
batch_size: ${batch_size}
# /dev/shm is 256 MB here and every in-flight batch lives there at ~1.2 MB/sample
# (2 views, 3x224x224, float32), so num_workers * prefetch_factor * batch_size must
# stay under ~213 samples. At batch 8: 16*1*8 = 128 samples = 154 MB.
# grad_accum_steps restores the paper's effective batch of 128/128/64.
#
# Measured on stage 2 (samples/s, higher is better):
#   batch  8 / 16 workers  213   <- this config
#   batch  8 /  8 workers  210
#   batch 64 /  2 workers  118   (higher GPU util, 1.8x slower wall-clock)
#   batch 128 / 0 workers  ~0    (serial augmentation, GPU idle)
# The augmentation is CPU-bound and the shm budget makes workers*batch a conserved
# quantity, so spending it on batch size starves the pipeline. Utilisation is not
# the objective; wall-clock is.
num_workers: 16
prefetch_factor: 1
pin_memory: false
drop_last: true
persistent_workers: false
shuffle: true
balance_tasks: ${balance_tasks}
collator:
  normalize_images: true
